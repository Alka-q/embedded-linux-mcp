[package]
name = "embedded-linux-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server and AI agent toolkit for controlling, testing, and debugging network-connected embedded Linux devices"
license = "MIT"
repository = "https://github.com/Alka-q/embedded-linux-mcp"
keywords = ["mcp", "embedded", "linux", "ssh", "busybox"]
categories = ["command-line-utilities", "development-tools::debugging", "embedded"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
